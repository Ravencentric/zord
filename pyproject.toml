[project]
name = "zord"
version = "0.0.2"
description = "A minimal, correct, user-friendly task runner"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ravencentric", email = "me@ravencentri.cc" }]
keywords = ["automation", "development", "task-runner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

dependencies = []

[project.urls]
Documentation = "https://github.com/Ravencentric/zord#readme"
Issues = "https://github.com/Ravencentric/zord/issues"
Repository = "https://github.com/Ravencentric/zord"

[project.scripts]
zord = "zord.cli:main"

[dependency-groups]
dev = [
  "pyrefly>=1.5",
  "pytest>=9",
  "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.33,<2.0"]
build-backend = "hatchling.build"

[tool.pyrefly]
preset = "all"
python-platform = "all"
project-includes = ["tasks.py", "src/**/*.py", "tests/**/*.py"]

[tool.pyrefly.errors]
explicit-any = false
implicit-bool = false
implicit-reexport = false
unused-call-result = false

[tool.pytest]
addopts = ["-ra", "--showlocals"]
filterwarnings = ["error"]
log_cli_level = "INFO"
strict = true

[tool.ruff.lint]
ignore = ["FURB189"]

[tool.uv]
exclude-newer = "3 days"
